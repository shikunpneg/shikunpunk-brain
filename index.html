<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shikunpunk 的大脑</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700;800&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Caveat:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<style>
/* ============ 场景 1：黑暗房间 ============ */
#stage { position: fixed; inset: 0; overflow: hidden; }
.dark-room {
  position: absolute; inset: 0;
  background: #030201;
}
/* ---------- 真实房间照片（开灯后可见） ---------- */
#room {
  position: absolute; inset: 0; opacity: 0;
  background-image: url('https://images.unsplash.com/photo-1513694203232-719a280e022f?q=80&w=2070&auto=format&fit=crop');
  background-size: cover;
  background-position: center 40%;
  /* 未开灯时极度昏暗：像眼睛还没适应 */
  filter: brightness(0.12) saturate(0.6);
  transition: filter 0.1s;
}
/* 开灯完成态：暖黄灯光照亮房间 */
#room.lit {
  filter: brightness(0.95) saturate(1.05) sepia(0.15);
}
/* 照片上叠加暖光色调（模拟白炽灯的 2700K 色温） */
#warmTint {
  position: absolute; inset: 0; z-index: 2; opacity: 0; pointer-events: none;
  background:
    radial-gradient(ellipse at 50% 0%, rgba(255,190,110,0.28) 0%, transparent 55%),
    linear-gradient(180deg, rgba(255,180,100,0.10) 0%, transparent 40%, rgba(20,10,5,0.35) 100%);
  mix-blend-mode: soft-light;
}
/* 灯泡处的强光源 */
#lightGlow {
  position: absolute; inset: 0; z-index: 3; opacity: 0; pointer-events: none;
  mix-blend-mode: screen;
  background: radial-gradient(circle at 50% 16vh,
    rgba(255,235,200,0.42) 0%, rgba(255,214,150,0.20) 25%,
    rgba(200,150,90,0.08) 50%, transparent 72%);
}
/* 光柱中的浮尘（开灯后缓缓飘动） */
#dust {
  position: absolute; inset: 0; z-index: 4; opacity: 0; pointer-events: none;
  background-image:
    radial-gradient(circle, rgba(255,240,220,0.5) 0px, transparent 1.5px),
    radial-gradient(circle, rgba(255,240,220,0.35) 0px, transparent 1.5px),
    radial-gradient(circle, rgba(255,240,220,0.25) 0px, transparent 2px);
  background-size: 300px 400px, 380px 520px, 460px 620px;
  background-position: 20% 10%, 60% 30%, 40% 50%;
  animation: dustFloat 22s linear infinite;
}
@keyframes dustFloat {
  from { background-position: 20% 110%, 60% 130%, 40% 150%; }
  to   { background-position: 25% -20%, 55% -30%, 45% -50%; }
}
#bulb { position: absolute; top: 6vh; left: 50%; transform: translateX(-50%); opacity: 0; z-index: 5; pointer-events: none; }
.bulb-glass {
  width: 56px; height: 72px;
  background: radial-gradient(circle at 35% 30%, #ffffff 0%, #ffe9c4 30%, #f5c877 70%, #e0a050 100%);
  border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
  box-shadow: 0 0 30px 8px rgba(255,220,160,0.55), 0 0 80px 30px rgba(255,200,120,0.25), inset 0 -6px 12px rgba(200,120,40,0.4);
}
.bulb-screw {
  width: 24px; height: 16px; margin: -4px auto 0;
  background: repeating-linear-gradient(180deg, #999 0px, #999 3px, #666 3px, #666 5px);
  border-radius: 2px 2px 0 0;
}
/* 开灯拉环（左上角，单独一根） */
#switch1 { position: absolute; top: 0; left: 8vw; z-index: 20; }
#hint {
  position: absolute; bottom: 12vh; left: 50%; transform: translateX(-50%);
  font-family: 'Cormorant Garamond', serif; font-style: italic;
  color: rgba(240,236,228,0.25); font-size: 0.95rem; letter-spacing: 0.3em;
  animation: hintPulse 3s ease-in-out infinite; z-index: 6;
}
@keyframes hintPulse { 0%,100% { opacity: 0.2; } 50% { opacity: 0.45; } }

/* ============ 场景 2：窗帘 + 文字（开灯后同屏浮现） ============ */
#intro { position: absolute; inset: 0; z-index: 10; visibility: hidden; }
.intro-bg {
  position: absolute; inset: 0;
  background: linear-gradient(180deg, #2a2016 0%, #221a10 60%, #1a130b 100%);
}
.curtain {
  position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 12;
  transform-origin: top center;
  background:
    repeating-linear-gradient(90deg,
      #5a2f18 0px, #6b3a1f 30px, #7d4a2a 55px, #6b3a1f 80px, #552b15 110px, #6b3a1f 140px),
    linear-gradient(180deg, rgba(255,220,170,0.15) 0%, transparent 30%, rgba(0,0,0,0.35) 100%);
  background-blend-mode: overlay;
  box-shadow: inset 0 -40px 60px rgba(0,0,0,0.45);
}
.curtain::after {
  content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 60px;
  background: linear-gradient(180deg, transparent 0%, rgba(0,0,0,0.4) 100%);
}
.curtain-rod {
  position: absolute; top: 4vh; left: 3vw; right: 3vw; height: 14px; z-index: 13;
  background: linear-gradient(180deg, #9c8465 0%, #6b5b3e 50%, #4a3d28 100%);
  box-shadow: 0 3px 8px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.15);
  border-radius: 7px;
}
/* 文字 —— 在窗帘后方（拉开窗帘才看见） */
.intro-text {
  position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
  text-align: center; z-index: 11; width: 92%; max-width: 1000px;
}
.intro-line { opacity: 0; transform: translateY(24px); margin-bottom: 0.7rem; text-shadow: 0 2px 12px rgba(0,0,0,0.6); }
.il-1 { font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 1rem; letter-spacing: 0.35em; color: var(--text-warm-gray); }
.il-2 { font-weight: 800; font-size: clamp(3rem, 13vw, 9rem); letter-spacing: -0.03em; line-height: 0.95; }
.il-3 { font-weight: 500; font-size: 2rem; }
.il-4, .il-5, .il-6 { font-size: 1.2rem; font-weight: 300; }
.il-6 { font-family: 'Cormorant Garamond', serif; font-style: italic; }
/* 拉开窗帘的提示拉环（右侧） */
#curtainPull { position: absolute; top: 0; right: 10vw; z-index: 14; visibility: hidden; opacity: 0; }
@media (max-width: 768px) {
  #switch1 { left: 6vw; }
  #curtainPull { right: 6vw; }
}
</style>
</head>
<body>

<div id="stage">
  <!-- 黑暗房间 -->
  <div class="dark-room">
    <div id="room"></div>
    <div id="warmTint"></div>
    <div id="lightGlow"></div>
    <div id="dust"></div>
    <div id="bulb"><div class="bulb-glass"></div><div class="bulb-screw"></div></div>
    <!-- 左上角拉环：开灯 -->
    <div class="lamp-switch" id="switch1">
      <div class="lamp-base"></div>
      <div class="pull-string"><div class="bead-chain"></div><div class="pull-handle"></div></div>
    </div>
    <div id="hint">拉 一 下 灯</div>
  </div>

  <!-- 开灯后：窗帘 + 文字 -->
  <div id="intro">
    <div class="intro-bg"></div>
    <div class="intro-text">
      <div class="intro-line il-1">这里是</div>
      <div class="intro-line il-2">SHIKUNPUNK</div>
      <div class="intro-line il-3">的大脑</div>
      <div class="intro-line il-4">你可以感受他的感受</div>
      <div class="intro-line il-5">关心他的关心</div>
      <div class="intro-line il-6">幻想他的幻想</div>
    </div>
    <div class="curtain" id="curtain"></div>
    <div class="curtain-rod" id="curtainRod"></div>
    <!-- 右侧拉环：拉开窗帘（文字在帘后，拉开即见） -->
    <div class="lamp-switch" id="curtainPull">
      <div class="lamp-base"></div>
      <div class="pull-string"><div class="bead-chain" style="height:90px"></div><div class="pull-handle"></div></div>
      <div class="switch-tag">拉开窗帘</div>
    </div>
  </div>
</div>

<div class="page-veil" id="pageVeil"></div>

<script src="shared.js"></script>
<script>
PageNav.arrive(); // 到达本页：亮灯（从黑屏渐入）

// ---------- 第一根拉环：开灯 ----------
let lightOn = false;
document.getElementById("switch1").addEventListener("click", function() {
  if (lightOn) return; lightOn = true;
  pullString(this);
  const room = document.getElementById("room");
  const overlays = ["#bulb", "#lightGlow", "#warmTint", "#dust"];
  const tl = gsap.timeline({ delay: 0.25 });
  // 先让房间以"极暗"状态出现（眼睛适应前的微光）
  tl.set(room, { opacity: 1 });
  // 白炽灯闪烁：照片亮度滤镜同步闪烁（真实的通电闪烁感）
  tl.to(overlays, { opacity: 0.35, duration: 0.06 });
  tl.call(() => room.style.filter = "brightness(0.35) saturate(0.7)", null, 0.06);
  tl.to(overlays, { opacity: 0.05, duration: 0.06 }, 0.06);
  tl.call(() => room.style.filter = "brightness(0.15) saturate(0.6)", null, 0.12);
  tl.to(overlays, { opacity: 0.7, duration: 0.07 }, 0.12);
  tl.call(() => room.style.filter = "brightness(0.6) saturate(0.85)", null, 0.19);
  tl.to(overlays, { opacity: 0.25, duration: 0.05 }, 0.19);
  tl.call(() => room.style.filter = "brightness(0.45) saturate(0.8)", null, 0.24);
  // 稳定点亮：房间达到暖亮状态
  tl.to(overlays, { opacity: 1, duration: 0.9, ease: "power2.out" }, 0.24);
  tl.call(() => {
    room.style.transition = "filter 0.9s ease-out";
    room.classList.add("lit");
  }, null, 0.24);
  tl.to("#lightGlow", { scale: 1.03, duration: 0.5, ease: "sine.inOut", yoyo: true, repeat: 1 }, "-=0.4");
  tl.to("#hint", { opacity: 0, duration: 0.4 }, 0);
  // 灯亮后进入"窗帘与文字"
  tl.call(() => {
    const intro = document.getElementById("intro");
    intro.style.visibility = "visible";
    gsap.fromTo(intro, { opacity: 0 }, { opacity: 1, duration: 0.8 });
    gsap.to(".intro-line", { opacity: 1, y: 0, duration: 0.8, stagger: 0.4, ease: "power2.out", delay: 0.4 });
    gsap.to("#curtainPull", { visibility: "visible", opacity: 1, duration: 1, delay: 1.5 });
  }, null, "+=1.0");
});

// ---------- 第二根拉环：拉开窗帘 → 停留欣赏 → 翻页到思想墙 ----------
let curtainOpen = false;
document.getElementById("curtainPull").addEventListener("click", function() {
  if (curtainOpen) return; curtainOpen = true;
  pullString(this);
  // 窗帘向上卷起
  gsap.timeline({ delay: 0.3 })
    .to("#curtain", { scaleY: 0, duration: 1.6, ease: "power2.inOut" })
    .to("#curtainRod", { opacity: 0, duration: 0.4 }, "-=0.3")
    // 拉开后停留 6 秒欣赏文字，然后翻页
    .call(() => setTimeout(() => PageNav.go("thoughts.html"), 6000));
});
</script>
</body>
</html>
